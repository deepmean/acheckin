name: probe-agentrouter

# Temporary reconnaissance workflow: needs Cloudflare WARP because the site
# blocks datacenter and this machine's egress. Manual dispatch only.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: pip install -q -r requirements.txt
      - name: Bring up Cloudflare WARP
        continue-on-error: true
        run: |
          set -e
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg \
            | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" \
            | sudo tee /etc/apt/sources.list.d/cloudflare-client.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq cloudflare-warp
          warp-cli --accept-tos registration new
          warp-cli --accept-tos mode proxy
          warp-cli --accept-tos connect
          for i in $(seq 1 40); do
            if ip=$(curl -s --max-time 6 --socks5-hostname 127.0.0.1:40000 https://api.ipify.org 2>/dev/null) && [ -n "$ip" ]; then
              echo "WARP ready: $ip"; exit 0
            fi
            sleep 3
          done
          echo "::warning::WARP not ready"
      - name: Probe refresh/session capabilities
        env:
          AR_EMAIL: ${{ secrets.AGENTROUTER_USERNAME }}
          AR_PASSWORD: ${{ secrets.AGENTROUTER_PASSWORD }}
          HTTP_PROXY: socks5h://127.0.0.1:40000
          HTTPS_PROXY: socks5h://127.0.0.1:40000
        run: python probe_ar.py