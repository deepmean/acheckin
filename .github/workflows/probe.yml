name: probe (temp)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install -q requests playwright
          python -m playwright install --with-deps chromium
      - name: Probe
        env:
          AGENTROUTER_USERNAME: ${{ secrets.AGENTROUTER_USERNAME }}
          AGENTROUTER_PASSWORD: ${{ secrets.AGENTROUTER_PASSWORD }}
        run: python probe_ci.py
