name: probe (temp)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install -q requests playwright
          python -m playwright install --with-deps chrome
      - name: Probe slider (xvfb + real chrome)
        env:
          AGENTROUTER_USERNAME: ${{ secrets.AGENTROUTER_USERNAME }}
          AGENTROUTER_PASSWORD: ${{ secrets.AGENTROUTER_PASSWORD }}
        run: xvfb-run -a --server-args="-screen 0 1920x1080x24" python probe_slider.py
      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: challenge-shot
          path: challenge.png
          if-no-files-found: ignore
