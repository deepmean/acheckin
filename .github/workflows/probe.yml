name: probe (temp)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  slider:
    name: slider crack
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install -q requests playwright
          python -m playwright install --with-deps chrome
      - name: Slider probe
        env:
          AGENTROUTER_USERNAME: ${{ secrets.AGENTROUTER_USERNAME }}
          AGENTROUTER_PASSWORD: ${{ secrets.AGENTROUTER_PASSWORD }}
        run: xvfb-run -a --server-args="-screen 0 1920x1080x24" python probe_slider2.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: slider-shot
          path: challenge.png
          if-no-files-found: ignore

  warp:
    name: warp egress
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: python -m pip install -q requests
      - name: Enable WARP
        uses: fscarmen/warp-on-actions@v1.3
        with:
          mode: warp
      - name: Probe via WARP
        env:
          AGENTROUTER_USERNAME: ${{ secrets.AGENTROUTER_USERNAME }}
          AGENTROUTER_PASSWORD: ${{ secrets.AGENTROUTER_PASSWORD }}
        run: sleep 5 && python probe_alt.py
