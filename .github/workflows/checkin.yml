name: AgentRouter Daily Check-in

# 定时说明：GitHub Actions cron 使用 UTC，北京时间 = UTC+8
#   3 19 * * *  -> 次日 03:03（北京时间）主批次
#  33 19 * * *  -> 次日 03:33（北京时间）备份批次（当天已成功则自动跳过）
on:
  schedule:
    - cron: '3 19 * * *'
    - cron: '33 19 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: agentrouter-checkin
  cancel-in-progress: false

jobs:
  checkin:
    name: checkin (${{ github.event.schedule || 'manual' }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip -q && pip install -q -r requirements.txt

      - name: Run check-in
        env:
          AGENTROUTER_USERNAME: ${{ secrets.AGENTROUTER_USERNAME }}
          AGENTROUTER_PASSWORD: ${{ secrets.AGENTROUTER_PASSWORD }}
          AGENTROUTER_BASE: ${{ vars.AGENTROUTER_BASE || 'https://agentrouter.org' }}
          BACKUP_RUN: ${{ github.event.schedule == '33 19 * * *' && '1' || '' }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python checkin.py

      - name: Persist history
        if: always()
        run: |
          set -e
          git config user.name  "agentrouter-bot"
          git config user.email "agentrouter-bot@users.noreply.github.com"
          git add state/history.jsonl 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "history 无变化，跳过提交"
            exit 0
          fi
          git commit -m "chore(checkin): $(TZ=Asia/Shanghai date +%F) record"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git push
