name: Daily Check-in (AgentRouter; DGB opt-in)

# Each hourly trigger checks the daily targets. GitHub may delay triggers;
# runtime waiting does not guarantee an exact 12-hour wall-clock interval.
# DGB defaults off. Enabling it requires an existing refresh session and an
# encryption key; password credentials are never passed to the DGB steps.
on:
  # 每小时 :05 检查随机槽位；等待上限由 gate.py 的 WAIT_AHEAD 控制。
  schedule:
    - cron: '5 * * * *'
  workflow_dispatch:
    inputs:
      slot:
        description: 'auto=按当天计划选未完成的槽位 / A / B / manual=立即签到'
        required: false
        default: auto

permissions:
  contents: write

concurrency:
  group: agentrouter-checkin
  cancel-in-progress: false

jobs:
  checkin:
    name: checkin
    # 可选：仓库变量 RUNNER_LABEL 设为自托管 runner 标签（如 [self-hosted, windows]）
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    # 闸门最多等 85 分钟 + 签到本身约 3 分钟；112 分钟的长等待会被 runner 回收（10-29 实测）
    timeout-minutes: 100
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Load latest persisted state
        run: git pull --ff-only origin main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Wait for today's random slot
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          SLOT: ${{ github.event.inputs.slot || 'auto' }}
          SLOT_MODE: wait
          HISTORY_FILES: state/history.jsonl,state/history_dgb.jsonl
          DGB_ENABLED: ${{ vars.DGB_ENABLED || 'false' }}
          DGB_ACCOUNTS: ${{ vars.DGB_ACCOUNT_NAMES || '["fjpg5som8g","deepmean"]' }}
          # RunningHub：gate 只需要邮箱做槽位判定，令牌仅给签到步骤
          RH_ACCOUNTS: ${{ vars.RH_ACCOUNT_EMAILS || '[]' }}
        run: python gate.py

      - name: Install dependencies
        if: steps.gate.outputs.skip != '1'
        run: |
          python -m pip install --upgrade pip -q
          pip install -q -r requirements.txt

      - name: Run regression tests
        if: steps.gate.outputs.skip != '1'
        run: python -m unittest discover -v

      - name: Bring up Cloudflare WARP (socks5 egress)
        if: ${{ steps.gate.outputs.skip != '1' && !contains(vars.RUNNER_LABEL, 'self-hosted') }}
        continue-on-error: true
        run: |
          set -e
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg \
            | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" \
            | sudo tee /etc/apt/sources.list.d/cloudflare-client.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq cloudflare-warp
          warp-cli --accept-tos registration new
          warp-cli --accept-tos mode proxy
          warp-cli --accept-tos connect
          # warp-cli 报 Connected 时 socks 端口未必已监听，必须实测打通再放行
          ready=0
          for i in $(seq 1 40); do
            if ip=$(curl -s --max-time 6 --socks5-hostname 127.0.0.1:40000 https://api.ipify.org 2>/dev/null) && [ -n "$ip" ]; then
              echo "WARP socks ready, egress ip: $ip"; ready=1; break
            fi
            sleep 3
          done
          warp-cli --accept-tos status
          if [ "$ready" != "1" ]; then echo "::warning::WARP socks5 未就绪，将回落到直连"; fi

      - name: Run check-in (AgentRouter)
        id: ar
        if: steps.gate.outputs.skip != '1'
        continue-on-error: true
        env:
          AGENTROUTER_USERNAME: ${{ secrets.AGENTROUTER_USERNAME }}
          AGENTROUTER_PASSWORD: ${{ secrets.AGENTROUTER_PASSWORD }}
          AGENTROUTER_BASE: ${{ vars.AGENTROUTER_BASE || 'https://agentrouter.org' }}
          CHECKIN_PROXY: ${{ contains(vars.RUNNER_LABEL, 'self-hosted') && '' || 'socks5h://127.0.0.1:40000' }}
          SLOT: ${{ steps.gate.outputs.slot }}
          SLOT_TARGET: ${{ steps.gate.outputs.target }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          DEBUG_DUMP: ${{ vars.DEBUG_DUMP }}
        run: python checkin.py

      - name: Persist DGB refresh checkpoint before network access
        id: dgb_prepare
        if: ${{ steps.gate.outputs.skip != '1' && vars.DGB_ENABLED == 'true' }}
        continue-on-error: true
        env:
          DGB_ENABLED: ${{ vars.DGB_ENABLED || 'false' }}
          DGB_ACCOUNTS: ${{ vars.DGB_ACCOUNT_NAMES || '["fjpg5som8g","deepmean"]' }}
          DGB_SESSIONS: ${{ secrets.DGB_SESSIONS }}
          DGB_SESSION_KEY: ${{ secrets.DGB_SESSION_KEY }}
          DGB_SESSION_STATE: state/dgb_sessions.enc
          DGB_CHECKPOINT_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          DGB_BASE: ${{ vars.DGB_BASE || 'https://freeapi.dgbmc.top' }}
          SLOT: ${{ steps.gate.outputs.slot }}
        run: |
          set -e
          python checkin_dgb.py --prepare
          git config user.name "agentrouter-bot"
          git config user.email "agentrouter-bot@users.noreply.github.com"
          git add -- state/dgb_sessions.enc
          git commit -m "chore(dgb): checkpoint before refresh"
          git pull --rebase --autostash origin main
          git push origin HEAD:main

      # DGB is opt-in and refresh-only. No password credentials are mounted.
      - name: Run check-in (DGB existing sessions)
        id: dgb
        if: ${{ steps.gate.outputs.skip != '1' && vars.DGB_ENABLED == 'true' && steps.dgb_prepare.outcome == 'success' }}
        continue-on-error: true
        env:
          DGB_ENABLED: ${{ vars.DGB_ENABLED || 'false' }}
          DGB_ACCOUNTS: ${{ vars.DGB_ACCOUNT_NAMES || '["fjpg5som8g","deepmean"]' }}
          DGB_SESSIONS: ${{ secrets.DGB_SESSIONS }}
          DGB_SESSION_KEY: ${{ secrets.DGB_SESSION_KEY }}
          DGB_SESSION_STATE: state/dgb_sessions.enc
          DGB_CHECKPOINT_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          DGB_BASE: ${{ vars.DGB_BASE || 'https://freeapi.dgbmc.top' }}
          SLOT: ${{ steps.gate.outputs.slot }}
          SLOT_TARGET: ${{ steps.gate.outputs.target }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python checkin_dgb.py

      # RunningHub: refresh-token only. No password is mounted, so daily runs
      # cannot create new login sessions.
      - name: Run check-in (RunningHub)
        id: rh
        if: ${{ steps.gate.outputs.skip != '1' && steps.gate.outputs.rh == '1' }}
        continue-on-error: true
        env:
          RH_ACCOUNTS: ${{ secrets.RH_ACCOUNTS }}
          RH_PASSWORD: ${{ secrets.RH_PASSWORD }}
          RH_TOKEN_KEY: ${{ secrets.RH_TOKEN_KEY }}
          RH_TOKEN_STATE: state/rh_tokens.enc
          RH_BASE: ${{ vars.RH_BASE || 'https://www.runninghub.ai' }}
          SLOT: ${{ steps.gate.outputs.slot }}
          SLOT_TARGET: ${{ steps.gate.outputs.target }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python checkin_rh.py

      - name: Verify enabled sites
        if: steps.gate.outputs.skip != '1'
        env:
          AR_OUTCOME: ${{ steps.ar.outcome }}
          DGB_OUTCOME: ${{ steps.dgb.outcome }}
          RH_OUTCOME: ${{ steps.rh.outcome }}
          DGB_ENABLED: ${{ vars.DGB_ENABLED || 'false' }}
          RH_OUTCOME_EXPECTED: ${{ steps.gate.outputs.rh }}
        run: |
          echo "AgentRouter outcome: $AR_OUTCOME"
          echo "DGB enabled: $DGB_ENABLED; outcome: $DGB_OUTCOME"
          echo "RunningHub expected: $RH_OUTCOME_EXPECTED; outcome: $RH_OUTCOME"
          if [ "$AR_OUTCOME" != "success" ]; then
            echo "::error::AgentRouter check-in failed"
            exit 1
          fi
          if [ "$DGB_ENABLED" = "true" ] && [ "$DGB_OUTCOME" != "success" ]; then
            echo "::error::DGB existing-session check-in failed"
            exit 1
          fi
          if [ "$RH_OUTCOME_EXPECTED" = "1" ] && [ "$RH_OUTCOME" != "success" ]; then
            echo "::error::RunningHub check-in failed"
            exit 1
          fi

      - name: Persist history
        if: always()
        run: |
          set -e
          git config user.name  "agentrouter-bot"
          git config user.email "agentrouter-bot@users.noreply.github.com"
          for path in state/history.jsonl state/history_dgb.jsonl state/history_rh.jsonl state/dgb_sessions.enc state/rh_tokens.enc; do
            if [ -f "$path" ]; then git add -- "$path"; fi
          done
          if git diff --cached --quiet; then
            echo "No state changes"
            exit 0
          fi
          git commit -m "chore(checkin): $(TZ=Asia/Shanghai date +%F) slot ${{ steps.gate.outputs.slot }}"
          git pull --rebase origin main
          git push origin HEAD:main
