name: AgentRouter Daily Check-in

# ── 时间机制：每天两个随机时间，严格间隔 12 小时，分钟避开整点 ──────────────
# gate.py 以北京日期为种子，当天固定生成偏移 off ∈ 0..300 分钟：
#     槽位 A = 00:05 + off      槽位 B = A 班实际执行时刻 + 12 小时
#     分钟 m = (5 + off) % 60 ∈ 3..57，永不整点
# 例：off=125 → A=02:10  B=14:10；off=0 → A=00:05  B=12:05
#
# 为什么是「12 条 cron + 闸门」而不是「一条精确 cron」：
#   实测本仓库 cron 会被丢弃或迟到 2~6 小时（日级 A 班迟到 2h51m / 4h54m；
#   日级 B 班连续两天整天没触发），单条 cron 无法承担精确时刻。
#   所以改成全天 12 条（每 2 小时）唤醒，每条只问「现在该不该签」：
#     目标在 150 分钟内 → 等到目标再签；目标已过 → 立即补签；否则跳过。
#   任一条丢失都会由下一条接管；槽位当天成功后写 history 去重，不会重复签。
#
# 出口 IP：agentrouter.org 前置阿里云 WAF，按 IP 信誉拦截 GitHub 默认出口
# （Azure 段会收到「滑动验证」挑战页）。因此签到前先拉起 Cloudflare WARP，
# 用它的 socks5 代理（127.0.0.1:40000）出网，实测可穿过 WAF 完成登录=签到。
on:
  # 每小时一条（UTC :05 = 北京 :05），全天 24 条。
  # 单条 cron 会被 GitHub 丢掉/延迟 2~6 小时，所以不押注某一条：
  # 每条只是「醒来看一眼」，闸门决定这次是否该签到（含去重与目标窗口判断）。
  # 等待窗口只有 40 分钟 —— 实测 112 分钟的长等待会被 runner 判 lost communication 杀掉。
  schedule:
    - cron: '5 * * * *'
  workflow_dispatch:
    inputs:
      slot:
        description: 'auto=按当天计划选未完成的槽位 / A / B / manual=立即签到'
        required: false
        default: auto

permissions:
  contents: write

concurrency:
  group: agentrouter-checkin
  cancel-in-progress: false

jobs:
  checkin:
    name: checkin
    # 可选：仓库变量 RUNNER_LABEL 设为自托管 runner 标签（如 [self-hosted, windows]）
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    # 闸门最多等 40 分钟 + 签到本身约 3 分钟；长等待会被 runner 回收
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Wait for today's random slot
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          SLOT: ${{ github.event.inputs.slot || 'auto' }}
          SLOT_MODE: wait
        run: python gate.py

      - name: Install dependencies
        if: steps.gate.outputs.skip != '1'
        run: |
          python -m pip install --upgrade pip -q
          pip install -q -r requirements.txt

      - name: Bring up Cloudflare WARP (socks5 egress)
        if: ${{ steps.gate.outputs.skip != '1' && !contains(vars.RUNNER_LABEL, 'self-hosted') }}
        continue-on-error: true
        run: |
          set -e
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg \
            | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" \
            | sudo tee /etc/apt/sources.list.d/cloudflare-client.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq cloudflare-warp
          warp-cli --accept-tos registration new
          warp-cli --accept-tos mode proxy
          warp-cli --accept-tos connect
          # warp-cli 报 Connected 时 socks 端口未必已监听，必须实测打通再放行
          ready=0
          for i in $(seq 1 40); do
            if ip=$(curl -s --max-time 6 --socks5-hostname 127.0.0.1:40000 https://api.ipify.org 2>/dev/null) && [ -n "$ip" ]; then
              echo "WARP socks ready, egress ip: $ip"; ready=1; break
            fi
            sleep 3
          done
          warp-cli --accept-tos status
          if [ "$ready" != "1" ]; then echo "::warning::WARP socks5 未就绪，将回落到直连"; fi

      - name: Run check-in
        if: steps.gate.outputs.skip != '1'
        env:
          AGENTROUTER_USERNAME: ${{ secrets.AGENTROUTER_USERNAME }}
          AGENTROUTER_PASSWORD: ${{ secrets.AGENTROUTER_PASSWORD }}
          AGENTROUTER_BASE: ${{ vars.AGENTROUTER_BASE || 'https://agentrouter.org' }}
          CHECKIN_PROXY: ${{ contains(vars.RUNNER_LABEL, 'self-hosted') && '' || 'socks5h://127.0.0.1:40000' }}
          SLOT: ${{ steps.gate.outputs.slot }}
          SLOT_TARGET: ${{ steps.gate.outputs.target }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          DEBUG_DUMP: ${{ vars.DEBUG_DUMP }}
        run: python checkin.py

      - name: Persist history
        if: always()
        run: |
          set -e
          git config user.name  "agentrouter-bot"
          git config user.email "agentrouter-bot@users.noreply.github.com"
          git add state/history.jsonl 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "history 无变化，跳过提交"
            exit 0
          fi
          git commit -m "chore(checkin): $(TZ=Asia/Shanghai date +%F) slot ${{ steps.gate.outputs.slot }}"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git push
