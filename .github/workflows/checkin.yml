name: AgentRouter Daily Check-in

# ── 时间机制（每天两个随机时间，严格间隔 12 小时，分钟避开整点）────────────
# gate.py 以北京日期为随机种子，当天固定生成两个时间点：
#     hA:m  与  (hA+12):m      m ∈ 7..11（永不整点）
# 例如今天抽到 04:09 / 16:09，明天抽到 11:07 / 23:07。
#
# 执行方式：cron 每小时 :07 触发一次轻量闸门 job（只跑标准库，几秒钟），
# 命中「目标前 90 秒 ~ 目标后 2 小时」窗口才放行真正的签到 job；
# 未命中时只留一条几秒钟的日志，不产生任何提交。
# 目标后 2 小时的宽限窗口同时充当自动补签：GitHub 定时延迟或首次失败都会重试。
#
# 出口 IP：agentrouter.org 前置阿里云 WAF，按 IP 信誉拦截 GitHub 默认出口
# （Azure 段会收到「滑动验证」挑战页）。因此签到前先拉起 Cloudflare WARP，
# 用它的 socks5 代理（127.0.0.1:40000）出网，实测可穿过 WAF 完成登录=签到。
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: agentrouter-checkin
  cancel-in-progress: false

jobs:
  gate:
    name: gate
    # 可选：仓库变量 RUNNER_LABEL 设为自托管 runner 标签（如 [self-hosted, windows]）
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 5
    outputs:
      hit: ${{ steps.g.outputs.hit }}
      target: ${{ steps.g.outputs.target }}
      plan: ${{ steps.g.outputs.plan }}
    steps:
      - uses: actions/checkout@v4
      - id: g
        name: Resolve today's random slots
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: python gate.py

  checkin:
    name: checkin (${{ needs.gate.outputs.hit }})
    needs: gate
    if: ${{ needs.gate.outputs.hit != 'none' }}
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip -q
          pip install -q -r requirements.txt

      - name: Bring up Cloudflare WARP (socks5 egress)
        if: ${{ !contains(vars.RUNNER_LABEL, 'self-hosted') }}
        continue-on-error: true
        run: |
          set -e
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg \
            | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" \
            | sudo tee /etc/apt/sources.list.d/cloudflare-client.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq cloudflare-warp
          warp-cli --accept-tos registration new
          warp-cli --accept-tos mode proxy
          warp-cli --accept-tos connect
          for i in $(seq 1 20); do
            if warp-cli --accept-tos status | grep -qi connected; then echo "WARP connected"; break; fi
            sleep 3
          done
          warp-cli --accept-tos status
          echo "egress ip via warp: $(curl -s --max-time 20 --socks5-hostname 127.0.0.1:40000 https://api.ipify.org || echo unknown)"

      - name: Run check-in
        env:
          AGENTROUTER_USERNAME: ${{ secrets.AGENTROUTER_USERNAME }}
          AGENTROUTER_PASSWORD: ${{ secrets.AGENTROUTER_PASSWORD }}
          AGENTROUTER_BASE: ${{ vars.AGENTROUTER_BASE || 'https://agentrouter.org' }}
          CHECKIN_PROXY: ${{ contains(vars.RUNNER_LABEL, 'self-hosted') && '' || 'socks5h://127.0.0.1:40000' }}
          SLOT: ${{ needs.gate.outputs.hit }}
          SLOT_TARGET: ${{ needs.gate.outputs.target }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          DEBUG_DUMP: ${{ vars.DEBUG_DUMP }}
        run: python checkin.py

      - name: Persist history
        if: always()
        run: |
          set -e
          git config user.name  "agentrouter-bot"
          git config user.email "agentrouter-bot@users.noreply.github.com"
          git add state/history.jsonl 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "history 无变化，跳过提交"
            exit 0
          fi
          git commit -m "chore(checkin): $(TZ=Asia/Shanghai date +%F) slot ${{ needs.gate.outputs.hit }}"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git push
