name: probe-warp (temp)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  warp:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: python -m pip install -q requests "requests[socks]" pysocks

      - name: Install Cloudflare WARP client
        run: |
          set -e
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg \
            | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" \
            | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq cloudflare-warp
          warp-cli --version || true

      - name: Register and connect (proxy mode)
        run: |
          set -x
          warp-cli --accept-tos registration new || true
          warp-cli --accept-tos mode proxy || true
          warp-cli --accept-tos connect || true
          sleep 12
          warp-cli --accept-tos status || true
          echo "--- egress via warp socks5 ---"
          curl -s --max-time 20 --socks5-hostname 127.0.0.1:40000 https://api.ipify.org || echo "socks curl failed"
          echo
          echo "--- direct egress ---"
          curl -s --max-time 20 https://api.ipify.org

      - name: Probe site through WARP socks5
        env:
          AGENTROUTER_USERNAME: ${{ secrets.AGENTROUTER_USERNAME }}
          AGENTROUTER_PASSWORD: ${{ secrets.AGENTROUTER_PASSWORD }}
        run: |
          python - <<'PY'
          import os, json, requests
          S = "socks5h://127.0.0.1:40000"
          UA = ("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
                "(KHTML, like Gecko) Chrome/141.0.0.0 Safari/537.36")
          M = ("aliyun_waf","访问验证","滑动验证","aliyunCaptcha")
          px = {"http": S, "https": S}
          try:
              ip = requests.get("https://api.ipify.org", proxies=px, timeout=25).text
              print("warp egress ip =", ip)
          except Exception as e:
              print("warp ip check failed:", type(e).__name__, e)
          for host in ("https://agentrouter.org", "https://ps.air-outer.com"):
              try:
                  r = requests.get(host + "/api/status", proxies=px, timeout=35,
                                   headers={"User-Agent": UA,
                                            "Accept": "application/json, text/plain, */*"})
                  t = r.text or ""
                  waf = any(m in t[:5000] for m in M)
                  print(f"### {host} GET /api/status -> HTTP {r.status_code} len={len(t)} waf={waf}")
                  if not waf:
                      d = r.json().get("data", {})
                      print("    system_name =", d.get("system_name"), "version =", d.get("version"))
              except Exception as e:
                  print(f"### {host} error: {type(e).__name__}: {e}")
          try:
              r = requests.post("https://agentrouter.org/api/user/login?turnstile=",
                                json={"username": os.environ["AGENTROUTER_USERNAME"],
                                      "password": os.environ["AGENTROUTER_PASSWORD"]},
                                proxies=px, timeout=40,
                                headers={"User-Agent": UA, "Content-Type": "application/json",
                                         "Origin": "https://agentrouter.org",
                                         "Referer": "https://agentrouter.org/login"})
              t = r.text or ""
              waf = any(m in t[:5000] for m in M)
              print(f"### login -> HTTP {r.status_code} len={len(t)} waf={waf}")
              if not waf:
                  j = r.json(); d = j.get("data") or {}
                  print("    success =", j.get("success"), "checked_in =", d.get("checked_in"),
                        "id =", d.get("id"), "quota =", d.get("quota"))
          except Exception as e:
              print("### login error:", type(e).__name__, e)
          PY
