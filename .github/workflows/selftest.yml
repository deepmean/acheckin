name: selftest (temp)

# 临时探针：验证本仓库的 schedule 触发器是否正常工作（每 11 分钟一次）
on:
  schedule:
    - cron: '*/11 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report
        run: |
          echo "schedule fired at $(date -u '+%Y-%m-%dT%H:%M:%SZ') UTC"
          echo "event=${{ github.event_name }}"
